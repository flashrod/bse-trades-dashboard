services:
  postgres:
    image: postgres:16-alpine
    container_name: bse-postgres
    environment:
      POSTGRES_USER: bse
      POSTGRES_PASSWORD: bse
      POSTGRES_DB: bse
    # 5433 on the host so we never fight a locally installed Postgres.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bse -d bse"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
